# Foundation model registry.
#
# For each model: class path (used by the driver to instantiate),
# available size variants, expected input semantics, pooling strategy,
# and any environment variables for overriding weight paths.
#
# Layer count (n_layers_total) is NOT hardcoded here — it is discovered
# at runtime by `models/get_model_info.py` because some models (Tahoe)
# vary by size variant.

models:

  scfoundation:
    class: scfm_eval.embedders.scfoundation.scFoundationEmbedder
    sizes: [default]
    expected_input: log1p_normalized   # adata.X must be normalized + log1p
    gene_vocab: scfoundation_19264     # Ensembl → gene symbol vocab, 19264 entries
    pooling: s_token                   # cell embedding = x[:, -1, :] (S-token)
    env_vars:
      SCFOUNDATION_CKPT: data/checkpoints/scfoundation/models.ckpt
      SCFOUNDATION_GENE_INDEX: data/checkpoints/scfoundation/OS_scRNA_gene_index.19264.tsv

  tahoe:
    class: scfm_eval.embedders.tahoe.TahoeEmbedder
    sizes: [70m, 1b, 3b]
    expected_input: raw_counts
    gene_vocab: tahoe_vocab            # bundled with weights from HF
    pooling: cls_token                 # cell embedding = x[:, 0, :] (CLS)
    weights_source: huggingface:tahoebio/tahoe-x1

  # ─── Below: planned, not yet implemented. See docs/adding_a_model.md. ───

  scgpt:
    class: scfm_eval.embedders.scgpt.scGPTEmbedder
    sizes: [default]
    expected_input: raw_counts
    gene_vocab: scgpt_vocab            # bundled with weights in model_dir
    pooling: cls_token                 # cell embedding = x[:, 0, :] (CLS token)
    env_vars:
      SCGPT_MODEL_DIR: data/checkpoints/scgpt/whole_human

  cellfm:
    class: scfm_eval.embedders.cellfm.CellFMEmbedder
    sizes: [default]
    expected_input: raw_counts
    gene_vocab: cellfm_gene_info      # CellFM/csv/gene_info.csv (~19k genes)
    pooling: mean_nonzero             # mean over non-zero gene positions (no CLS)
    framework: mindspore              # requires cellfm-env, NOT main .venv
    env_vars:
      CELLFM_CKPT: data/checkpoints/cellfm/base_weight.ckpt
    notes: >
      Requires conda activate cellfm-env. Checkpoint from
      https://huggingface.co/ShangguanNingyuan/CellFM/tree/main

  uce:
    class: scfm_eval.embedders.uce.UCEEmbedder
    sizes: [4layer, 33layer]
    expected_input: raw_counts        # adata.X must be raw (un-normalised) counts
    gene_vocab: uce_protein_emb       # ESM2 protein embeddings per gene symbol
    pooling: cls_token                # cell embedding = transformer_layer_i_output[0, :, :] (CLS, seq-first)
    env_vars:
      UCE_MODEL_CKPT: data/checkpoints/uce/4layer_model.torch
      UCE_MODEL_FILES_DIR: data/checkpoints/uce/model_files
    notes: >
      Model files are auto-downloaded from figshare on first use (requires internet).
      Use conda activate uce-env (envs/uce.yml).  For the 33-layer variant set
      UCE_MODEL_CKPT to the 33layer_model.torch path and pass nlayers=33.

  geneformer:
    class: scfm_eval.embedders.geneformer.GeneformerEmbedder   # NOT YET PRESENT
    sizes: [6L, 12L, 30M]
    expected_input: rank_tokens        # NB: rank-ordered, not counts
    gene_vocab: geneformer_vocab
    pooling: mean
    status: planned
