# Foundation model registry.
#
# For each model: class path (used by the driver to instantiate),
# available size variants, expected input semantics, pooling strategy,
# and any environment variables for overriding weight paths.
#
# Layer count (n_layers_total) is NOT hardcoded here — it is discovered
# at runtime by `models/get_model_info.py` because some models (Tahoe)
# vary by size variant.

models:

  scfoundation:
    class: scfm_eval.embedders.scfoundation.scFoundationEmbedder
    sizes: [default]
    expected_input: log1p_normalized   # adata.X must be normalized + log1p
    gene_vocab: scfoundation_19264     # Ensembl → gene symbol vocab, 19264 entries
    pooling: s_token                   # cell embedding = x[:, -1, :] (S-token)
    env_vars:
      SCFOUNDATION_CKPT: data/checkpoints/scfoundation/models.ckpt
      SCFOUNDATION_GENE_INDEX: data/checkpoints/scfoundation/OS_scRNA_gene_index.19264.tsv

  tahoe:
    class: scfm_eval.embedders.tahoe.TahoeEmbedder
    sizes: [70m, 1b, 3b]
    expected_input: raw_counts
    gene_vocab: tahoe_vocab            # bundled with weights from HF
    pooling: cls_token                 # cell embedding = x[:, 0, :] (CLS)
    weights_source: huggingface:tahoebio/tahoe-x1

  # ─── Below: planned, not yet implemented. See docs/adding_a_model.md. ───

  scgpt:
    class: scfm_eval.embedders.scgpt.scGPTEmbedder   # NOT YET PRESENT
    sizes: [default]
    expected_input: raw_counts
    gene_vocab: scgpt_vocab
    pooling: cls_token
    status: planned

  geneformer:
    class: scfm_eval.embedders.geneformer.GeneformerEmbedder   # NOT YET PRESENT
    sizes: [6L, 12L, 30M]
    expected_input: rank_tokens        # NB: rank-ordered, not counts
    gene_vocab: geneformer_vocab
    pooling: mean
    status: planned
