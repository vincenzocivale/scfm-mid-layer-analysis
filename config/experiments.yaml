# Experiment grid for the paper.
#
# Each `run` declares: which dataset, which model (+optional size), and which
# downstream tasks to evaluate. The driver (scripts/run_experiment_grid.py)
# resolves task-specific config from config/datasets.yaml.
#
# Reorder/comment-out runs to control which subset of the grid is executed.
# Use --filter on the CLI for ad-hoc selection without editing this file.

runs:

  # ── Cell-type classification: brain × {scfoundation, tahoe-1b} ─────────────
  - dataset: brain
    model: scfoundation
    tasks: [classification]

  - dataset: brain
    model: tahoe
    model_size: 1b
    tasks: [classification]

  - dataset: spinal
    model: scfoundation
    tasks: [classification]

  - dataset: spinal
    model: tahoe
    model_size: 1b
    tasks: [classification]

  - dataset: liver
    model: scfoundation
    tasks: [classification]

  - dataset: liver
    model: tahoe
    model_size: 1b
    tasks: [classification]

  - dataset: brain
    model: scgpt
    tasks: [classification]

  - dataset: spinal
    model: scgpt
    tasks: [classification]

  - dataset: liver
    model: scgpt
    tasks: [classification]

  - dataset: brain
    model: cellfm
    tasks: [classification]

  - dataset: spinal
    model: cellfm
    tasks: [classification]

  - dataset: liver
    model: cellfm
    tasks: [classification]

  - dataset: brain
    model: uce
    tasks: [classification]

  - dataset: spinal
    model: uce
    tasks: [classification]

  - dataset: liver
    model: uce
    tasks: [classification]

  - dataset: brain
    model: genecompass
    tasks: [classification]

  - dataset: spinal
    model: genecompass
    tasks: [classification]

  - dataset: liver
    model: genecompass
    tasks: [classification]

  # ── Tabula Sapiens: cell-type classification ───────────────────────────────
  - dataset: tabula-blood
    model: scfoundation
    tasks: [classification]

  - dataset: tabula-blood
    model: tahoe
    model_size: 1b
    tasks: [classification]

  - dataset: tabula-blood
    model: scgpt
    tasks: [classification]

  - dataset: tabula-blood
    model: uce
    tasks: [classification]

  - dataset: tabula-blood
    model: genecompass
    tasks: [classification]

  - dataset: tabula-immune
    model: scfoundation
    tasks: [classification]

  - dataset: tabula-immune
    model: tahoe
    model_size: 1b
    tasks: [classification]

  - dataset: tabula-immune
    model: scgpt
    tasks: [classification]

  - dataset: tabula-immune
    model: uce
    tasks: [classification]

  - dataset: tabula-immune
    model: genecompass
    tasks: [classification]

  # ── Pseudotime ─────────────────────────────────────────────────────────────
  - dataset: inner_ear
    model: scfoundation
    tasks: [pseudotime]

  - dataset: inner_ear
    model: tahoe
    model_size: 1b
    tasks: [pseudotime]

  - dataset: inner_ear
    model: scgpt
    tasks: [pseudotime]

  - dataset: inner_ear
    model: cellfm
    tasks: [pseudotime]

  - dataset: inner_ear
    model: uce
    tasks: [pseudotime]

  - dataset: inner_ear
    model: genecompass
    tasks: [pseudotime]

  # ── Perturbation response ──────────────────────────────────────────────────
  - dataset: D1_Stim8hr
    model: scfoundation
    tasks: [perturbation]

  - dataset: D1_Stim8hr
    model: tahoe
    model_size: 1b
    tasks: [perturbation]

  - dataset: D1_Stim8hr
    model: scgpt
    tasks: [perturbation]

  - dataset: D1_Stim8hr
    model: cellfm
    tasks: [perturbation]

  - dataset: D1_Stim8hr
    model: uce
    tasks: [perturbation]

  - dataset: D1_Stim8hr
    model: genecompass
    tasks: [perturbation]

# Stage-1 defaults (overridable per-run if needed)
extraction_defaults:
  scfoundation:
    chunk_size: 20000
    batch_size: 1
    fp16: true
  tahoe:
    chunk_size: 50000
    batch_size: 16
    fp16: true
  scgpt:
    chunk_size: 50000
    batch_size: 32
    fp16: true
  cellfm:
    chunk_size: 20000
    batch_size: 4
    fp16: false   # MindSpore env; fp16 flag not used but kept for driver compatibility
  uce:
    chunk_size: 50000
    batch_size: 16
    fp16: true
  genecompass:
    chunk_size: 50000
    batch_size: 32
    fp16: true
