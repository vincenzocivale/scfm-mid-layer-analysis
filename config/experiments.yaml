# Experiment grid for the paper.
#
# Each `run` declares: which dataset, which model (+optional size), and which
# downstream tasks to evaluate. The driver (scripts/run_experiment_grid.py)
# resolves task-specific config from config/datasets.yaml.
#
# Reorder/comment-out runs to control which subset of the grid is executed.
# Use --filter on the CLI for ad-hoc selection without editing this file.

runs:

  # ── Cell-type classification ────────────────────────────────────────────
  - dataset: ra_gse296117
    model: scfoundation
    tasks: [classification]

  - dataset: ra_gse296117
    model: tahoe
    model_size: 1b
    tasks: [classification]

  - dataset: ra_gse296117
    model: scgpt
    tasks: [classification]

  - dataset: ra_gse296117
    model: uce
    tasks: [classification]

  - dataset: ra_gse296117
    model: genecompass
    tasks: [classification]

  # ── Pseudotime ─────────────────────────────────────────────────────────────
  - dataset: gse277032_organoids
    model: scfoundation
    tasks: [pseudotime]

  - dataset: gse277032_organoids
    model: tahoe
    model_size: 1b
    tasks: [pseudotime]

  - dataset: gse277032_organoids
    model: scgpt
    tasks: [pseudotime]

  - dataset: gse277032_organoids
    model: uce
    tasks: [pseudotime]

  - dataset: gse277032_organoids
    model: genecompass
    tasks: [pseudotime]

  - dataset: bessier_bro_timecourse
