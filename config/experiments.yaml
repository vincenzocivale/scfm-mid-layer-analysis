    model_size: 1b
    tasks: [pseudotime]

  - dataset: bessier_bro_timecourse
    model: scgpt
    tasks: [pseudotime]

  - dataset: bessier_bro_timecourse
    model: uce
    tasks: [pseudotime]

  - dataset: bessier_bro_timecourse
    model: genecompass
    tasks: [pseudotime]

  - dataset: bessier_dmgo
    model: scfoundation
    tasks: [pseudotime]

  - dataset: bessier_dmgo
    model: tahoe
    model_size: 1b
    tasks: [pseudotime]

  - dataset: bessier_dmgo
    model: scgpt
    tasks: [pseudotime]

  - dataset: bessier_dmgo
    model: uce
    tasks: [pseudotime]

  - dataset: bessier_dmgo
    model: genecompass
