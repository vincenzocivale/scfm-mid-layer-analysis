# Stage-1 defaults (overridable per-run if needed)
extraction_defaults:
  scfoundation:
    chunk_size: 20000
    batch_size: 1
    fp16: true
  tahoe:
    chunk_size: 50000
    batch_size: 16
    fp16: true
  scgpt:
    chunk_size: 50000
    batch_size: 32
    fp16: true
  cellfm:
    chunk_size: 20000
    batch_size: 4
    fp16: false   # MindSpore env; fp16 flag not used but kept for driver compatibility
  uce:
    chunk_size: 50000
    batch_size: 16
    fp16: true
  genecompass:
    chunk_size: 50000
    batch_size: 32
    fp16: true
